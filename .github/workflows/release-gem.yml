name: Release Gem
on:
  push:
    tags:
      - v*

jobs:
  release:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment: release  # Requires commits to be on `main` branch

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@8e41b362d2589a22a44c1cfa214b3c83052c195b  # v1.318.0
        with:
          ruby-version: 4.0

      - name: Install dependencies
        run: bundle install

      - name: Publish gem
        uses: rubygems/release-gem@052cc82692552de3ef2b81fd670e41d13cba8092  # v1.4.0

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          gh release create "$TAG_NAME" \
            --title "$VERSION" \
            --generate-notes
